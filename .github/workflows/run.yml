name: Run Sudha AI

on:
  workflow_dispatch:

jobs:
  run-sudha:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run
        run: python main.py
